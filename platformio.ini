[common]
platform = espressif32
board = lolin_d32_pro
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git
    bblanchon/ArduinoJson@^7

[env:release]
extends = common

[env:debug]
extends = common
build_flags =
    ${common.build_flags}
    -DDEV_MODE

# --- Native host tests (pure logic only) ---
# Run with: ~/.platformio/penv/bin/pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7
lib_compat_mode = off
test_build_src = no
