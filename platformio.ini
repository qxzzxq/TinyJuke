[platformio]
default_envs = lolin_d32_pro

[common]
# espressif32 7.x ships arduino-esp32 3.x (ledcAttach, dma_desc_num, etc.)
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_flags =
    -DA2DP_LEGACY_I2S_SUPPORT=1
# PSRAM compile flags — interpolated only by boards that actually have PSRAM (D32 Pro,
# WROVER-E). The plain WROOM-32 (lolin_d32) omits these; defining them with no PSRAM
# present makes the core try to init absent PSRAM.
psram_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git
    bblanchon/ArduinoJson@^7
    https://github.com/pschatzmann/ESP32-A2DP.git

# ---- Board axis ----
# Lolin D32 Pro: variant predefines SS/TFT_* macros (see config.h #undef guards).
[board_d32pro]
extends = common
board = lolin_d32_pro
build_flags = ${common.build_flags} ${common.psram_flags}

# Custom WROVER-E mainboard: generic esp32dev variant (no D32-Pro pin predefines).
# -DBOARD_WROVER_E selects the new pin map in config.h.
[board_wrover_e]
extends = common
board = esp32dev
build_flags = ${common.build_flags} ${common.psram_flags} -DBOARD_WROVER_E

# Lolin D32 (plain): ESP-WROOM-32, 4 MB flash, NO PSRAM. Prototype for the WROVER-E
# pinout before the custom PCB — same new pin map (-DBOARD_WROVER_E), minus PSRAM.
[board_lolin_d32]
extends = common
board = lolin_d32
build_flags = ${common.build_flags} -DBOARD_WROVER_E

# ---- Flash / partition axis ----
# Dual-6MB-slot OTA layout for the 16 MB chip (board def may claim 4 MB, so override).
# Switching tables requires one flash over USB; afterwards OTA via web UI.
[flash_16mb]
board_build.partitions = partitions_16mb_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456

# 4 MB variant (GD25LQ32) — same code, smaller OTA slots (~1.94 MB each).
[flash_4mb]
board_build.partitions = partitions_4mb_ota.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 2031616

# ---- Concrete build profiles (board x flash x release/dev) ----
[env:lolin_d32_pro]
extends = board_d32pro, flash_16mb

[env:lolin_d32_pro-4mb]
extends = board_d32pro, flash_4mb

[env:lolin_d32_pro-debug]
extends = board_d32pro, flash_16mb
build_flags = ${board_d32pro.build_flags} -DDEV_MODE

[env:wrover_e]
extends = board_wrover_e, flash_16mb

[env:wrover_e-debug]
extends = board_wrover_e, flash_16mb
build_flags = ${board_wrover_e.build_flags} -DDEV_MODE

# Plain Lolin D32 (WROOM-32, 4 MB, no PSRAM) running the new WROVER-E pin map.
[env:lolin_d32]
extends = board_lolin_d32, flash_4mb


# --- Native host tests (pure logic only) ---
# Run with: ~/.platformio/penv/bin/pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7
lib_compat_mode = off
test_build_src = no
